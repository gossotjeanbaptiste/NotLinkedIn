<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style/admin.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='icon/NotLinkedIn_icon.ico') }}">
    <script src="{{ url_for('static', filename='script/script.js') }}"></script>
    <script src="{{ url_for('static', filename='script/admin.js') }}"></script>
</head>
<body>
    <header>
        <div class="container">
            <div class="header-logo">
                <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" class="logo">
                <h1>Administration</h1>
            </div>
            <nav>
                <a href="{{ url_for('index') }}">Accueil</a>
                <span>Bonjour {{ session.username }} !</span>
                <a href="{{ url_for('logout') }}">Déconnexion</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="admin-panel">
            <h2>Panneau d'administration</h2>
            
            <div class="admin-tabs">
                <button class="tab-btn active" onclick="showTab('companies')">Entreprises</button>
                <button class="tab-btn" onclick="showTab('advertisements')">Annonces</button>
                <button class="tab-btn" onclick="showTab('applications')">Candidatures</button>
            </div>

            <!-- Companies Tab -->
            <div id="companies" class="tab-content active">
                <div class="section-header">
                    <h3>Gestion des Entreprises</h3>
                    <button class="btn btn-primary" onclick="showAddCompanyForm()">Ajouter une entreprise</button>
                </div>
                
                <div id="companies-list">
                    <!-- Companies will be loaded here -->
                </div>
                
                <div class="pagination" id="companies-pagination">
                    <!-- Pagination will be loaded here -->
                </div>
            </div>

            <!-- Advertisements Tab -->
            <div id="advertisements" class="tab-content">
                <div class="section-header">
                    <h3>Gestion des Annonces</h3>
                    <button class="btn btn-primary" onclick="showAddAdForm()">Ajouter une annonce</button>
                </div>
                
                <div id="advertisements-list">
                    <!-- Advertisements will be loaded here -->
                </div>
                
                <div class="pagination" id="advertisements-pagination">
                    <!-- Pagination will be loaded here -->
                </div>
            </div>

            <!-- Applications Tab -->
            <div id="applications" class="tab-content">
                <div class="section-header">
                    <h3>Candidatures Reçues</h3>
                </div>
                
                <div id="applications-list">
                    <!-- Applications will be loaded here -->
                </div>
                
                <div class="pagination" id="applications-pagination">
                    <!-- Pagination will be loaded here -->
                </div>
            </div>
        </section>
    </main>

    <!-- Modal for forms -->
    <div id="adminModal" class="modal hidden">
        <div class="modal-content">
            <span class="close" onclick="closeAdminModal()">&times;</span>
            <div id="modal-form-content">
                <!-- Form content will be loaded here -->
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2025 Job Board. Tous droits réservés.</p>
        </div>
    </footer>

</body>
</html>
